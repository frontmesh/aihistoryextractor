<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Fix a flaky Playwright test - DeepSeek</title>
    <style>
      body { font-family: sans-serif; margin: 0; background: #f5f5f5; }
      #scroll { height: 420px; overflow-y: auto; padding: 20px; }
      .ds-message { margin: 12px 0; padding: 12px; border: 1px solid #ddd; border-radius: 10px; background: white; }
      .ds-message.user { background: #eef2ff; }
      .ds-assistant-message-main-content { white-space: pre-wrap; }
      .fbb737a4 { white-space: pre-wrap; }
    </style>
  </head>
  <body>
    <main id="scroll">
      <div class="ds-message">
        <div class="fbb737a4">This rendered message should not be used when the API works.</div>
      </div>
      <div class="ds-message">
        <div class="ds-assistant-message-main-content">Rendered fallback assistant message.</div>
      </div>
    </main>
  </body>
</html>
